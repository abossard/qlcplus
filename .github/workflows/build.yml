name: QLCplus Github Actions CI Build

on: ["push", "pull_request"]

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    name: QLCplus Linux ${{matrix.task}} (${{matrix.appimage_arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: build-v5-mcp
            runner: ubuntu-24.04
            appimage_arch: x86_64
            qt_dir_name: gcc_64
            qt_arch: linux_gcc_64
          - task: build-v5-mcp
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
            qt_dir_name: gcc_arm64
            qt_arch: linux_gcc_arm64
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      CC: gcc
      CXX: g++
      QT_VERSION: "6.10.2"
      # libfuse2 does not exist on Ubuntu 24.04; libfuse2t64 provides libfuse.so.2
      PACKAGES_ALL:
        gdb
        libasound2-dev
        libusb-1.0-0-dev
        libftdi1-dev
        shared-mime-info
        libudev-dev
        libmad0-dev
        libsndfile1-dev
        liblo-dev
        libfftw3-dev
        libgl1-mesa-dev
        libxml2-utils
        xvfb
        chrpath
        libfuse2t64
        wget
        libpulse-dev

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set General ENV variables
        run: |
          echo "CI_BRANCH=$(echo $GITHUB_REF | cut -d '/' -f 3)" >> $GITHUB_ENV
          echo "CI_SECURE_ENV_VARS=$(if [ -z '${{ secrets.something }}' ]; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_ENV
          echo "CI_EVENT_TYPE=$(if [ 'schedule' == '${{ github.event_name }}' ]; then echo 'cron'; else echo '${{ github.event_name }}'; fi)" >> $GITHUB_ENV
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "TASK=$(echo '${{matrix.task}}' | cut -d '-' -f 2)" >> $GITHUB_ENV
          echo "INSTALL_ROOT=`pwd`/install_root" >> $GITHUB_ENV
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV

      - name: Set Qt ENV variables
        run: |
          echo "QT=$(echo '${{matrix.task}}' | cut -d '-' -f 2)" >> $GITHUB_ENV
          echo "QT_INSTALL_DIR=/opt" >> $GITHUB_ENV
          echo "QTDIR=/opt/Qt/${QT_VERSION}/${{ matrix.qt_dir_name }}" >> $GITHUB_ENV

      - name: Print ENV vars
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "PACKAGES_ALL: ${PACKAGES_ALL}"
          echo "TASK: ${TASK}"
          echo "QT: ${QT}"
          echo "QTDIR: ${QTDIR}"
          echo "ARCH: ${{ matrix.appimage_arch }} / $(uname -m)"
          echo "NPROC: ${NPROC}"

      # Plain apt-get instead of a caching action: the cache action pins exact
      # versions from a possibly-stale index and, worse, reports success even
      # when every package fails to install.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${PACKAGES_ALL}
          pkg-config --exists libftdi1 libusb-1.0
          echo "OK: libftdi1 $(pkg-config --modversion libftdi1), libusb-1.0 $(pkg-config --modversion libusb-1.0)"

      - name: Install Qt through aqt (and python)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Install python-lxml for fixtures-tool # with the now-registered aqt python
        run: pip install lxml

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}-${{ matrix.appimage_arch }}

      - name: Setup ruby cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      - name: Print program versions and username
        run: |
          echo "CXX:"
          ${CXX} --version
          echo "Python:"
          python --version
          echo "WHOAMI:"
          whoami

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webaccess/web-dmx/package-lock.json

      - name: Build web-dmx web app
        run: npm ci && npm run build
        working-directory: webaccess/web-dmx

      - name: Configure for v5 MCP build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QTDIR/lib/cmake/" -Dqmlui=ON -Dmcp_server=ON -Dappimage=ON -DINSTALL_ROOT=${INSTALL_ROOT} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          sed -i "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cmake --build build --parallel `nproc`

      - name: Test
        run: cmake --build build --target check

      - name: Install
        run: |
          cmake --build build --target install
          cp -v resources/icons/svg/qlcplus.svg ${INSTALL_ROOT}
          cp -v platforms/linux/qlcplus.desktop ${INSTALL_ROOT}
          cp -v $QTDIR/translations/qtbase_* ${INSTALL_ROOT}/share/qlcplus/translations/

      - name: Set APPVERSION
        run: |
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Verify web-dmx SPA is bundled
        run: |
          test -f "${INSTALL_ROOT}/share/qlcplus/web/web-dmx/index.html" \
            || { echo "web-dmx/index.html missing from install root"; \
                 find ${INSTALL_ROOT} -name 'index.html'; exit 1; }
          echo "OK: web-dmx SPA present"

      - name: Adapt qlcplus for AppImage (v5)
        run: |
          chrpath -r "../lib" ${INSTALL_ROOT}/usr/bin/qlcplus-qml
          sed -i -e 's/Exec=qlcplus --open %f/Exec=qlcplus-qml/g' ${INSTALL_ROOT}/qlcplus.desktop

      - name: Strip Binaries (v5)
        run: |
          strip -v ${INSTALL_ROOT}/usr/bin/qlcplus-qml
          find ${INSTALL_ROOT}/usr/lib/ -name libqlcplusengine.so.1.0.0 -exec strip -v {} \;

      - name: Delete unused files for AppImage
        run: |
          find ${INSTALL_ROOT}/usr/bin/ -name plugins.qmltypes -type f -delete
          find ${INSTALL_ROOT}/usr/bin -name *.qmlc -type f -delete
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Extras QtQuick/Particles.2 QtQuick/XmlListModel
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/designer QtQuick/Controls.2/Material
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/Universal QtQuick/Controls.2/Fusion
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/Imagine QtQuick/Controls.2/Scene2D

      - name: Build AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget -c https://github.com/AppImage/AppImageKit/releases/download/continuous/AppRun-${ARCH} -O ${INSTALL_ROOT}/AppRun
          chmod a+x ${INSTALL_ROOT}/AppRun
          wget -c https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage -O ./appimagetool.AppImage
          chmod a+x ./appimagetool.AppImage
          ./appimagetool.AppImage -v ${INSTALL_ROOT}
          mv -v "Q_Light_Controller_Plus_-_QLC+-${ARCH}.AppImage" qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}-${ARCH}.AppImage

      - name: Verify AppImage payload architecture
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          ./qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}-${ARCH}.AppImage --appimage-extract > /dev/null
          file squashfs-root/usr/bin/qlcplus-qml
          case "${ARCH}" in
            x86_64)  file squashfs-root/usr/bin/qlcplus-qml | grep -q 'ELF 64-bit.*x86-64' ;;
            aarch64) file squashfs-root/usr/bin/qlcplus-qml | grep -q 'ELF 64-bit.*aarch64' ;;
          esac
          test -f squashfs-root/share/qlcplus/web/web-dmx/index.html
          echo "OK: payload is ${ARCH} and web-dmx is bundled"

      - name: Verify glibc baseline (Raspberry Pi OS Trixie compat)
        if: ${{ matrix.appimage_arch == 'aarch64' }}
        run: |
          MAX_ALLOWED=2.39
          MAX_FOUND=$(find squashfs-root -type f \( -name '*.so*' -o -perm -u+x \) -print0 \
            | xargs -0 -r -n1 objdump -T 2>/dev/null \
            | grep -oE 'GLIBC_2\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "max GLIBC required: ${MAX_FOUND} (allowed: ${MAX_ALLOWED})"
          test -n "${MAX_FOUND}"
          printf '%s\n%s\n' "${MAX_FOUND}" "${MAX_ALLOWED}" | sort -VC \
            || { echo "FAIL: needs glibc ${MAX_FOUND} > ${MAX_ALLOWED}"; exit 1; }
          echo "OK: runs on Raspberry Pi OS Trixie (glibc 2.41)"

      - name: Test Load AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          rm -rf squashfs-root
          ./qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}-${ARCH}.AppImage --platform offscreen --version

      - name: Store AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}-AppImage-${{ matrix.appimage_arch }}
          path: qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}-${{matrix.appimage_arch}}.AppImage

  build-windows:
    continue-on-error: true
    runs-on: windows-latest
    name: QLCplus Windows ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        task: [build-v5-mcp]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      QT_VERSION: "6.10.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Set ENV variables
        shell: bash
        run: |
          echo "CI_BRANCH=$(echo $GITHUB_REF | cut -d '/' -f 3)" >> $GITHUB_ENV
          echo "CI_SECURE_ENV_VARS=$(if [ -z '${{ secrets.something }}' ]; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_ENV
          echo "CI_EVENT_TYPE=$(if [ 'schedule' == '${{ github.event_name }}' ]; then echo 'cron'; else echo '${{ github.event_name }}'; fi)" >> $GITHUB_ENV
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "TASK=$(echo '${{matrix.task}}' | cut -d '-' -f 2)" >> $GITHUB_ENV
          echo "QT=${QT:-$(echo '${{matrix.task}}' | cut -d '-' -f 2)}" >> $GITHUB_ENV
          echo "QTDIR=/d/a/qlcplus/qlcplus/qt/Qt/${{ env.QT_VERSION }}/mingw_64" >> $GITHUB_ENV
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV

      - name: Set v4 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          echo "OUTFILE=`grep 'OutFile' platforms/windows/qlcplus4Qt6.nsi | cut -d'"' -f 2`" >> $GITHUB_ENV
          echo "NSIS_SCRIPT=qlcplus4Qt6.nsi" >> $GITHUB_ENV

      - name: Set v5 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v5' || matrix.task == 'build-v5-mcp' }}
        run: |
          echo "OUTFILE=`grep 'OutFile' platforms/windows/qlcplus5Qt6.nsi | cut -d'"' -f 2`" >> $GITHUB_ENV
          echo "NSIS_SCRIPT=qlcplus5Qt6.nsi" >> $GITHUB_ENV

      - name: Print ENV vars
        shell: bash
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "TASK: ${TASK}"
          echo "QT: ${QT}"
          echo "NPROC: ${NPROC}"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: "${{ github.workspace }}/qt/"
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Update and install MSYS2 (64bit)
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          release: true
          update: false
          path-type: inherit
          install: >-
            wget
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libmad
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-python-lxml
            mingw-w64-x86_64-nsis

      - name: D2XX SDK (64 bit)
        shell: msys2 {0}
        run: |
          mkdir -p /c/projects/D2XXSDK
          wget https://qlcplus.org/misc/CDM-v2.12.36.20-WHQL-Certified.zip -O /c/projects/D2XXSDK/cdm.zip
          cd /c/projects/D2XXSDK
          unzip cdm.zip
          cd amd64
          gendef.exe - ftd2xx64.dll > ftd2xx.def
          dlltool -k --input-def ftd2xx.def --dllname ftd2xx64.dll --output-lib libftd2xx.a

      - name: Print program versions
        shell: msys2 {0}
        run: |
          echo "pwd:"
          pwd
          echo "CXX:"
          which ${CXX} || true
          ${CXX} -v || true
          echo "cmake:"
          which cmake || true
          cmake --version || true
          pkg-config --modversion libusb-1.0
          echo "ccache:"
          ccache --version || true

      - name: Fix build
        shell: msys2 {0}
        run: |
          # force a release build
          sed -i -e 's/Debug/Release/g' CMakeLists.txt
          # disable Velleman plugin
          sed -i -e 's/    add_subdirectory(velleman)/#    add_subdirectory(velleman)/g' plugins/CMakeLists.txt
          # fix MSYS2 system path
          sed -i -e 's/$ENV{SystemDrive}\/msys64/D:\/a\/_temp\/msys64/g' platforms/windows/CMakeLists.txt
          # fix project path in NSIS script
          sed -i -e 's/c\:\\projects/d:\\a\\qlcplus/g' platforms/windows/${{env.NSIS_SCRIPT}}

      - name: Setup Node.js (Windows)
        if: ${{ matrix.task != 'build-v4' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webaccess/web-dmx/package-lock.json

      - name: Build web-dmx web app (Windows)
        if: ${{ matrix.task != 'build-v4' }}
        run: npm ci && npm run build
        working-directory: webaccess/web-dmx

      - name: Configure v4 build for Windows
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure v5 build for Windows
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v5' }}
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -Dqmlui=ON

      - name: Configure v5 MCP build for Windows
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v5-mcp' }}
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -Dqmlui=ON -Dmcp_server=ON

      - name: Build for Windows
        shell: msys2 {0}
        run: |
          sed -i "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cd build
          ninja

      - name: Install on Windows
        shell: msys2 {0}
        run: |
          cd build
          ninja install

      - name: Set APPVERSION
        shell: msys2 {0}
        run: |
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Run windeployqt for v4
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v4' }}
        run: |-
          ./translate.sh release ui
          cp *.qm /c/qlcplus
          cd /c/qlcplus
          ${{ env.QTDIR }}/bin/windeployqt qlcplus.exe qlcplusengine.dll qlcplusui.dll qlcpluswebaccess.dll plugins/dmxusb.dll

      - name: Run windeployqt for v5
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v5' || matrix.task == 'build-v5-mcp' }}
        run: |-
          SRC_DIR=$PWD
          ./translate.sh release qmlui
          cp *.qm /c/qlcplus
          cd /c/qlcplus
          ${{ env.QTDIR }}/bin/windeployqt --qmldir $SRC_DIR/qmlui/qml qlcplus-qml.exe qlcplusengine.dll plugins/dmxusb.dll

      - name: Build installation package
        shell: msys2 {0}
        run: |
          cd /c/qlcplus
          echo 'Creating package...'
          makensis -X'SetCompressor /FINAL lzma' ${{env.NSIS_SCRIPT}}
          mv /c/qlcplus/${{env.OUTFILE}} /d/a/qlcplus/qlcplus/${{matrix.task}}-${{env.OUTFILE}}

      - name: Store executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: QLC+-${{matrix.task}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.exe
          path: ${{matrix.task}}-${{env.OUTFILE}}

  build-macos:
    runs-on: macos-15
    name: QLCplus macOS ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        task: [build-v5-mcp]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      QT_VERSION: "6.10.2"
      MACOS_KEYCHAIN: build.keychain
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
      QLCPLUS_MAC_APP_DIR: /Users/runner/QLC+.app

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set ENV variables
        shell: bash
        run: |
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV
          echo "QTDIR=${{ github.workspace }}/qt/Qt/${{ env.QT_VERSION }}/macos" >> $GITHUB_ENV
          echo "NPROC=`sysctl -n hw.ncpu`" >> $GITHUB_ENV

      - name: Set v4 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |

      - name: Set v5 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v5' || matrix.task == 'build-v5-mcp' }}
        run: |

      - name: Print ENV vars
        shell: bash
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "TASK: ${TASK}"
          echo "QTDIR: ${QTDIR}"
          echo "NPROC: ${NPROC}"

      - name: Dependencies
        run: |
          brew update
          brew install fftw mad libsndfile libftdi
          brew link --overwrite python@3.14

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          dir: "${{ github.workspace }}/qt/"
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webaccess/web-dmx/package-lock.json

      - name: Build web-dmx web app
        run: npm ci && npm run build
        working-directory: webaccess/web-dmx

      - name: Configure v4 build
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |-
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure v5 build
        shell: bash
        if: ${{ matrix.task == 'build-v5' }}
        run: |-
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -Dqmlui=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure v5 MCP build
        shell: bash
        if: ${{ matrix.task == 'build-v5-mcp' }}
        run: |-
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -Dqmlui=ON -Dmcp_server=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: |-
          sed -i '' "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cd build
          make -j${{ env.NPROC }}

      - name: Install
        shell: bash
        run: |-
          cd build
          make install/fast

      - name: Set APPVERSION
        shell: bash
        run: |-
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Fix v4 dylib dependencies
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |-
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/Frameworks/libsndfile.1.dylib
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/MacOS/qlcplus
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/MacOS/qlcplus-fixtureeditor
          ${{ env.QTDIR }}/bin/macdeployqt ~/QLC+.app

      - name: Fix v5 dylib dependencies
        shell: bash
        if: ${{ matrix.task == 'build-v5' || matrix.task == 'build-v5-mcp' }}
        run: |-
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/Frameworks/libsndfile.1.dylib
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/MacOS/qlcplus-qml
          ${{ env.QTDIR }}/bin/macdeployqt ~/QLC+.app -qmldir=qmlui/qml

      - name: Ad-hoc code sign app bundle
        shell: bash
        run: |
          APP=~/QLC+.app
          # Remove static archives — they can't be code-signed and aren't needed at runtime
          find "$APP" -name '*.a' -delete
          # Remove sed backup files (e.g. Info.plist-e, Info.plist'')
          find "$APP" -name 'Info.plist*' ! -name 'Info.plist' -delete
          # Sign all individual files inside frameworks (replaces Qt's Team ID signatures
          # with ad-hoc to match the main executable — prevents Team ID mismatch at runtime)
          find "$APP/Contents/Frameworks" -type f -exec codesign --force --sign - {} \; 2>/dev/null || true
          # Sign framework bundles
          find "$APP/Contents/Frameworks" -name '*.framework' -exec codesign --force --sign - {} \;
          # Sign all plugin dylibs (recursive into subdirectories)
          find "$APP/Contents/PlugIns" -name '*.dylib' -exec codesign --force --sign - {} \;
          find "$APP/Contents/Resources" -name '*.dylib' -exec codesign --force --sign - {} \; 2>/dev/null || true
          # Sign main executable(s) (no --options runtime: hardened runtime requires
          # matching Team IDs across all loaded libraries, which ad-hoc signing can't provide)
          codesign --force --sign - "$APP/Contents/MacOS/"*
          # Sign the bundle
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create DMG
        # Use retry loop to work around a race condition on macOS causing
        # 'Resource busy' errors with 'hdiutil'. See
        # https://github.com/actions/runner-images/issues/7522
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 12
          retry_wait_seconds: 1
          command: |
            OUTDIR=$PWD
            cd platforms/macos/dmg
            ./create-dmg --volname "Q Light Controller Plus ${{env.APPVERSION}}" \
            --volicon $OUTDIR/resources/icons/qlcplus.icns \
            --background background.png \
            --window-size 400 300 \
            --window-pos 200 100 \
            --icon-size 64 \
            --icon "QLC+" 0 150 \
            --app-drop-link 200 150 \
            $OUTDIR/QLC+_${{ matrix.task }}.dmg \
            ~/QLC+.app

      - name: Notarize and staple DMG
        shell: bash
        if: false # ${{ env.MACOS_NOTARY_KEY_P8 != '' }}
        run: |-
          DMG_PATH="QLC+_${{ matrix.task }}.dmg"
          echo "${MACOS_NOTARY_KEY_P8}" > /tmp/AuthKey.p8
          xcrun notarytool submit \
            --key /tmp/AuthKey.p8 \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER}" \
            --wait "${DMG_PATH}"
          xcrun stapler staple "${DMG_PATH}"
          rm -f /tmp/AuthKey.p8

      - name: Store DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: QLC+-${{matrix.task}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.dmg
          path: QLC+_${{ matrix.task }}.dmg

      - name: Create Homebrew tar.gz
        run: |
          cd ~
          tar -czf "$GITHUB_WORKSPACE/qlcplus-pre-macos-arm64.tar.gz" "QLC+.app"

      - name: Store Homebrew tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: qlcplus-pre-macos-arm64.tar.gz
          path: qlcplus-pre-macos-arm64.tar.gz

  release-mcp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/mcp-server'
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    name: Release MCP builds
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*mcp*'

      - name: Download Homebrew artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'qlcplus-pre-*'

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcp-latest
          name: "QLC+ MCP Server (latest)"
          body: |
            Automated build of QLC+ with MCP server support from the `mcp-server` branch.
            Built from commit ${{ github.sha }}.

            ## Install with Homebrew
            ```
            brew install abossard/qlcplus/qlcplus
            ```
          prerelease: true
          make_latest: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
