// ---------- drawing ----------
function mix(a, b, f) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * f)).join(",")})`;
}

let labelEdge = {};  // right edge of the last label per row, so labels never overlap on narrow screens
function marker(ctx, x, top, H, s, color, width, dash, label, labelTop = top) {
  ctx.strokeStyle = color; ctx.lineWidth = width * s; ctx.setLineDash(dash.map(d => d * s));
  ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, H); ctx.stroke(); ctx.setLineDash([]);
  const w = label ? ctx.measureText(label).width + 8 * s : 0;
  if (label && x >= (labelEdge[labelTop] ?? -Infinity)) {
    labelEdge[labelTop] = x + w + 2 * s;
    ctx.fillStyle = color; ctx.fillRect(x, labelTop, w, 15 * s);
    ctx.fillStyle = css("--surface-1"); ctx.fillText(label, x + 4 * s, labelTop + 7.5 * s);
  }
}

// A band's text: label, the reviewer's verdict, and the Claim confidence when the analysis has it and the label was not changed.
function bandLabel(i) {
  const sec = rating.sections[i], src = doc.sections.find(d => d.start_bar === sec.start_bar && d.label === sec.label), c = src && !sec.correct_label ? src.confidence ?? src.label_confidence : null;
  return (sec.correct_label || sec.label) + (sec.verdict === "ok" ? " ✓" : sec.correct_label ? " ✎" : "") + (c != null ? ` ${Math.round(c)}%` : "");
}

function drawTimeline(c, name, t0, t1, opts) {
  views[name] = { t0, t1, rows: opts.rows };
  labelEdge = {};
  const ctx = c.getContext("2d"), W = c.width, H = c.height, s = devicePixelRatio;
  if (!W || !H) return;
  const X = t => (t - t0) / (t1 - t0) * W;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = css("--surface-1"); ctx.fillRect(0, 0, W, H);
  ctx.font = `${12 * s}px -apple-system, sans-serif`; ctx.textBaseline = "middle";
  const R = opts.rows, secBottom = (R.sec[0] + R.sec[1]) * s;
  // sections, as the reviewer corrected them
  rating.sections.forEach((sec, i) => {
    const label = sec.correct_label || sec.label, x0 = X(secStartTime(i)), x1 = X(barTime(secEnd(i)));
    if (x1 < 0 || x0 > W) return;
    ctx.fillStyle = css("--sec-" + label) || css("--text-muted"); ctx.fillRect(x0 + s, R.sec[0] * s, Math.max(1, x1 - x0 - 2 * s), R.sec[1] * s);
    if (x1 - x0 > 40 * s) {
      const full = bandLabel(i), text = ctx.measureText(full).width + 10 * s < x1 - x0 ? full : full.replace(/ \d+%$/, "");
      ctx.fillStyle = "#fff"; ctx.fillText(text, Math.max(x0, 0) + 5 * s, (R.sec[0] + R.sec[1] / 2) * s);
    }
  });
  // reference from VirtualDJ: its break regions, and Mixed In Key energy cues stored as VDJ cue points
  if (R.ref) {
    const y = R.ref[0] * s, h = R.ref[1] * s;
    ctx.fillStyle = css("--surface-2"); ctx.fillRect(0, y, W, h);
    (reference.breaks || []).forEach(([a, b]) => {
      const x0 = X(a), x1 = X(b); if (x1 < 0 || x0 > W) return;
      ctx.fillStyle = css("--ref"); ctx.fillRect(x0, y, x1 - x0, h);
      if (x1 - x0 > 50 * s) { ctx.fillStyle = "#fff"; ctx.fillText("VDJ break", Math.max(x0, 0) + 4 * s, y + h / 2); }
    });
    (reference.cues || []).forEach(c => {
      const x = X(c.pos); if (x < 0 || x > W) return;
      const m = /Energy\s*(\d+)/.exec(c.name), label = m ? "E" + m[1] : c.name;
      ctx.fillStyle = css("--text-primary"); ctx.fillRect(x, y, 2 * s, h);
      ctx.fillText(label, x + 3 * s, y + h / 2);
    });
    if (!(reference.breaks || []).length && !(reference.cues || []).length) { ctx.fillStyle = css("--text-muted"); ctx.fillText("no VirtualDJ reference", 4 * s, y + h / 2); }
  }
  candidateRows().forEach((cr, i) => {
    const y = R.cand[i][0] * s, h = R.cand[i][1] * s;
    ctx.fillStyle = css("--surface-2"); ctx.fillRect(0, y, W, h);
    if (cr.name === "dropdetector") { let free = 0;  // every tick, the probability only where it is likely and there is room
      cr.data.drops.forEach(dr => {
        const x = X(dr.time); if (x < 0 || x > W) return;
        ctx.globalAlpha = dr.confidence == null ? 1 : 0.35 + 0.65 * dr.confidence; ctx.fillStyle = css("--text-primary"); ctx.fillRect(x - s, y, 2 * s, h); ctx.globalAlpha = 1;
        const text = dr.confidence == null ? "" : Math.round(dr.confidence * 100) + "%";
        if (text && dr.confidence >= 0.5 && x >= free) { ctx.fillText(text, x + 3 * s, y + h / 2); free = x + ctx.measureText(text).width + 8 * s; }
      });
    }
    else cr.data.sections.forEach((sec, j, all) => {
      const x0 = X(sec.start), x1 = X(j + 1 < all.length ? all[j + 1].start : doc.track.duration); if (x1 < 0 || x0 > W) return;
      ctx.fillStyle = css("--sec-" + sec.label) || css("--text-muted"); ctx.fillRect(x0, y, Math.max(1, x1 - x0 - s), h);
    });
    ctx.font = `${10 * s}px -apple-system, sans-serif`;
    ctx.globalAlpha = 0.8; ctx.fillStyle = css("--surface-1"); ctx.fillRect(0, y, ctx.measureText(cr.label).width + 8 * s, h); ctx.globalAlpha = 1;
    ctx.fillStyle = css("--text-secondary"); ctx.fillText(cr.label, 4 * s, y + h / 2); ctx.font = `${12 * s}px -apple-system, sans-serif`;
  });
  // waveform
  const pk = doc.peaks.values, rate = doc.peaks.rate, mid = (R.wave[0] + R.wave[1] / 2) * s, amp = R.wave[1] / 2 * s;
  ctx.fillStyle = css("--wave");
  const i0 = Math.max(0, Math.floor(t0 * rate)), i1 = Math.min(pk.length, Math.ceil(t1 * rate));
  const step = Math.max(1, Math.floor((i1 - i0) / W));
  for (let i = i0; i < i1; i += step) { let m = 0; for (let j = i; j < i + step && j < i1; j++) m = Math.max(m, pk[j]); ctx.fillRect(X(i / rate), mid - m * amp, Math.max(1, (W / (i1 - i0)) * step - 0.5), 2 * m * amp || 1); }
  // beat grid (zoom): detected grid in muted ink, corrected bar starts in accent when shifted
  if (opts.beats) {
    const shift = gridShift(), shifted = Math.abs(shift) > 0.001;
    doc.beats.forEach((b, i) => {
      if (b + shift < t0 || b + shift > t1) return;
      const down = isDownbeatIndex(i);
      ctx.fillStyle = down ? (shifted ? css("--accent") : css("--text-primary")) : css("--text-muted");
      ctx.fillRect(X(b + (rating.grid.offset_ms || 0) / 1000), R.wave[0] * s, (down ? 3 : 1) * s, R.wave[1] * s);
    });
  }
  const starts = doc.bars.start, lv = doc.bars.levels, bw = 4 * period();
  if (R.energy) {
    const y0 = (R.energy[0] + R.energy[1]) * s, h = R.energy[1] * s;
    ctx.fillStyle = css("--text-muted"); ctx.fillText("energy", 4 * s, (R.energy[0] + 6) * s);
    ctx.strokeStyle = css("--accent"); ctx.lineWidth = 2 * s; ctx.beginPath();
    starts.forEach((t, k) => { if (lv.loud[k] == null) return; const x = X(t + bw / 2), y = y0 - lv.loud[k] * h; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  }
  if (R.lanes) {
    const lh = R.lanes[1] / LANES.length, lo = css("--lane-lo"), hi = css("--lane-hi");
    LANES.forEach((ln, li) => {
      const y = (R.lanes[0] + li * lh) * s;
      (lv[ln] || []).forEach((v, k) => { if (v == null) return; ctx.fillStyle = mix(lo, hi, v); ctx.fillRect(X(starts[k]), y + s, Math.max(1, X(starts[k] + bw) - X(starts[k]) - 0.5), lh * s - 2 * s); });
      ctx.fillStyle = css("--text-primary"); ctx.globalAlpha = 0.85; ctx.fillText(ln, 4 * s, y + lh * s / 2); ctx.globalAlpha = 1;
    });
  }
  const labels = opts.eventLabels;
  rating.sections.forEach((sec, i) => {
    const label = sec.correct_label || sec.label;
    if (i === 0 || !SECTION_EVENTS.has(label)) return;
    const x = X(barTime(secStart(i))); if (x < 0 || x > W) return;
    const color = sec.verdict === "ok" ? css("--good") : sec.verdict === "wrong" ? css("--warn") : css("--text-primary");
    if (sec.true_start_bar != null && sec.true_start_bar !== sec.start_bar) marker(ctx, X(barTime(sec.start_bar)), secBottom, H, s, css("--text-muted"), 1, [2, 4], "");
    marker(ctx, x, secBottom, H, s, color, label === "drop" ? 2.5 : 1.5, [], label + (sec.verdict === "ok" ? " ✓" : sec.added ? " ★" : ""), R.wave[0] * s);
  });
  rating.events.forEach(ev => {
    if (SECTION_EVENTS.has(ev.kind)) return;
    const x = X(barTime(evBar(ev))); if (x < 0 || x > W) return;
    const color = ev.verdict === "ok" ? css("--good") : ev.verdict === "wrong" ? css("--bad") : ev.verdict === "off" ? css("--warn") : css("--text-primary");
    if (ev.offset_bars) marker(ctx, X(barTime(ev.bar)), secBottom, H, s, css("--text-muted"), 1, [2, 4], "");
    marker(ctx, x, secBottom, H, s, color, ev.kind === "drop" ? 2 : 1.5, ev.kind.startsWith("vocal") ? [3, 3] : ev.verdict === "wrong" ? [6, 4] : [],
           labels ? ev.kind.replace("_", " ") + (ev.verdict === "wrong" ? " ✗" : ev.verdict === "ok" ? " ✓" : "") : "", (R.wave[0] + 34) * s);
  });
  rating.missed.forEach(m => {
    const x = X(m.time ?? barTime(m.bar)); if (x < 0 || x > W) return;
    marker(ctx, x, secBottom, H, s, css("--mark"), 2, [6, 3], labels || !FREE_KINDS.has(m.kind) ? "★ " + m.kind.replace("_", " ") : "", (R.wave[0] + 16) * s);
  });
  if (excerptEnd) { ctx.fillStyle = css("--accent"); ctx.globalAlpha = 0.08; const a = X(excerptStart); ctx.fillRect(a, 0, X(excerptEnd) - a, H); ctx.globalAlpha = 1; }
  const px = X(audio.currentTime); ctx.fillStyle = css("--playhead"); ctx.fillRect(px - s, 0, 2 * s, H);
}

function zoomWindow() { const n = zoomBars(), k = barAt(audio.currentTime), a = Math.max(0, k - n / 2); return [a ? barTime(a) : 0, barTime(a + n)]; }

function draw() {
  if (!doc || !$("#overview")) return;
  drawTimeline($("#overview"), "overview", 0, doc.track.duration, { rows: rows("overview"), eventLabels: false });
  if (!(drag && drag.name === "zoom" && drag.moved)) views.zoomRange = zoomWindow();
  const [a, b] = views.zoomRange;
  drawTimeline($("#zoom"), "zoom", a, b, { rows: rows("zoom"), beats: true, eventLabels: true });
  const pos = $("#pos"); if (pos) pos.textContent = `${fmt(audio.currentTime)} · bar ${barAt(audio.currentTime)}`;
}
function tick() {
  if (excerptEnd && audio.currentTime >= excerptEnd) { audio.pause(); excerptEnd = null; }
  if (doc && !audio.paused && !drag) draw();
  if (cur && !audio.paused && document.body.dataset.view === "round") { drawStrip(cur.k); updateNow(); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
audio.addEventListener("seeked", draw);

// ---------- question screen: one Probe of the current Review round at a time ----------
// Each play is its own short clip, so it starts at once and never seeks. The strip shows the clip's waveform,
// bar lines and marker; bar buttons answer "bar:<n>" where the question takes taps.
let quiz = null, quizIndex = 0, quizShown = 0, quizBusy = false, quizWhat = false, quizLoading = false, cur = null;  // cur: the play in the audio element
const quizPlayed = new Set(), strips = [];
const DOUBLE_TAP_MS = 350;
const PICK_MS = 500;  // a bar answer stays on the strip this long, so a wrong pick is noticed
let chosenBar = null;  // a second tap this soon after a new question is the old answer's double tap
const BREAK_EVERY = 10;
const DEFAULT_LABELS = ["intro", "buildup", "drop", "breakdown", "groove", "outro"];
const DEFINITIONS = {
  intro: "Intro: the track starts. Sparse, often just drums, building towards the first full part.",
  buildup: "Buildup: tension rises before a drop. Snare rolls, a riser, faster hats, the kick often drops out.",
  drop: "Drop: the payoff. Kick and bass hit full, the loudest and biggest part of the track.",
  breakdown: "Breakdown: the beat falls away. Calm, melodic or vocal, before the energy comes back.",
  groove: "Groove: a steady full beat. Kick and bass run on, the energy stays level, nothing big changes.",
  outro: "Outro: the track winds down. Parts drop out and the beat thins towards the end.",
};
const KEYS = { yes: "Y", no: "N", none: "N", skip: "C", a: "A", b: "B", neither: "N" };
function pref(k, d) { try { const v = localStorage.getItem("edm." + k); return v === null ? d : v === "1"; } catch { return d; } }
function setPref(k, v) { try { localStorage.setItem("edm." + k, v ? "1" : "0"); } catch { /* private mode */ } }
let autoplayOn = pref("autoplay", true), cueOn = pref("cue", true), loopOn = false;

const tapsOn = p => p.tap ?? (p.question === "yesno" || p.question === "locate");
const labelsOf = p => p.labels && p.labels.length ? p.labels : DEFAULT_LABELS;
const askedLabel = p => p.question === "label" ? [...DEFAULT_LABELS, ...labelsOf(p)].find(l => new RegExp("\\b" + l + "\\b", "i").test(p.prompt)) : undefined;
const cueApplies = pl => pl.mark != null && pl.click_shift == null;
const barLines = pl => (pl.grid || []).filter(g => g[1] && g[2] != null);
const pickable = (p, bar) => bar < (p.before ?? Infinity);   // a probe may name the first bar that cannot be tapped
const clipUrl = (p, pl) => `/clip/${p.id}/${pl.id}` + (cueApplies(pl) && cueOn ? "?cue=1" : "");
const isOn = (p, v) => p.answer === v || (v === "no" && String(p.answer).startsWith("is:"));

async function loadRound() {
  const r = await api("/api/round");
  quiz = r.round ? r : null;
  $("#btnRound").hidden = !quiz;
  updateProgress();
}
function openProbes() { return quiz.probes.filter(p => p.answer == null).length; }
// Next unanswered after i (wrapping); once all are answered, simply the next one, then the done screen.
function nextProbe(i) {
  const n = quiz.probes.length;
  for (let d = 1; d <= n; d++) { const k = (i + d) % n; if (quiz.probes[k].answer == null) return k; }
  return i + 1 < n ? i + 1 : -1;
}
function showRound(i) {
  currentId = null; doc = null; renderList();
  history.replaceState(null, "", location.pathname);
  goProbe(i);
}
// `auto`: the reviewer's answer (or Continue) was the tap that lets the audio element start the next question's clip by itself.
function goProbe(i, auto) {
  quizIndex = i < 0 ? quiz.probes.length : i;
  setView("round");
  renderProbe();
  scrollTo(0, 0);
  if (auto && autoplayOn && quiz.probes[quizIndex]) playProbe(0, true);
}
function showSongs() { setView("list"); history.replaceState(null, "", location.pathname); }
$("#btnRound").addEventListener("click", async () => { await loadRound(); if (quiz) showRound(openProbes() ? nextProbe(-1) : -1); });
$("#btnSongs").addEventListener("click", showSongs);

function playName(p, k) { return p.question === "ab" ? "Play " + String.fromCharCode(65 + k) : p.plays.length > 1 ? `Play ${k + 1}` : "Play"; }
const toggle = (id, text, on, off) => `<button id="${id}" class="${on && !off ? "on" : ""}" aria-pressed="${!!on && !off}" ${off ? "disabled" : ""}>${text}</button>`;

function renderProbe() {
  const p = quiz.probes[quizIndex];
  audio.pause(); audio.loop = false; excerptEnd = null; cur = null; strips.length = 0; quizWhat = quizLoading = false; quizShown = performance.now();
  if (!p) return renderDone();
  chosenBar = String(p.answer).startsWith("bar:") ? +p.answer.slice(4) : null;
  const theory = quiz.theories.find(t => t.id === p.theory), taps = tapsOn(p), label = askedLabel(p);
  const lines = taps ? barLines(p.plays.find(pl => barLines(pl).length) || p.plays[0]) : [];
  $("#main").innerHTML = `<div class="quiz" data-probe="${esc(p.id)}">
    <div class="q-theory">${theory ? esc(theory.text) : ""}</div>
    <div class="q-title">${esc(p.title)}</div>
    <p class="q-prompt">${esc(p.prompt)}</p>
    <p class="q-define">${DEFINITIONS[label] ? esc(DEFINITIONS[label]) : ""}</p>
    <div class="q-cards ${p.plays.length > 1 ? "two" : ""}">${p.plays.map((pl, k) => `<div class="q-card">
      <button class="q-play" data-k="${k}"><span class="q-label"></span>${p.plays.length === 1 ? " <kbd>Space</kbd>" : ""}</button>
      <canvas class="q-wave" data-k="${k}" aria-label="Waveform of the clip, bar lines and marker"></canvas></div>`).join("")}</div>
    <div class="q-barzone"><div class="q-hint">${lines.length ? (p.question === "locate" ? "Tap the bar where it starts" : "Or tap the bar where it really starts") : ""}</div>
      <div class="q-bars">${lines.map((g, i) => `<button class="q-barbtn ${p.answer === "bar:" + g[2] ? "on" : ""}" data-v="bar:${g[2]}" aria-label="It starts at bar ${g[2]}" ${pickable(p, g[2]) ? "" : "disabled"}>${i + 1}</button>`).join("")}</div></div>
    <div class="q-opts" id="qOpts">
      <button id="optReplay">↻ Replay <kbd>R</kbd></button>${toggle("optAutoplay", "Autoplay", autoplayOn)}${toggle("optLoop", "Loop", loopOn)}${toggle("optCue", "Cue", cueOn, !p.plays.some(cueApplies))}
    </div>
    <div class="q-bar">
      <div class="q-nav"><button id="qBack" ${quizIndex ? "" : "disabled"}>‹ Back <kbd>←</kbd></button><span class="status" id="qCount" role="status">${countText()}</span><button id="qSkip">Skip <kbd>S</kbd> ›</button></div>
      <button id="qNow" class="primary" disabled>It starts now <kbd>Enter</kbd></button>
      <div class="q-answers" id="qAnswers">${answerButtons(p)}</div>
    </div></div>`;
  labelPlays();
  document.querySelectorAll(".q-wave").forEach(c => setupStrip(c, p, p.plays[+c.dataset.k], taps && barLines(p.plays[+c.dataset.k]).length > 0));
  $(".quiz").addEventListener("click", quizClick);
}
const countText = () => `${quizIndex + 1} of ${quiz.probes.length}`;
// Messages (a failed save, an audio error) take the place of the count; nothing is added to the layout.
let noteTimer = null;
function note(text) {
  const c = $("#qCount"), at = quizShown;
  if (!c) return;
  c.textContent = text;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { if (quizShown === at && $("#qCount")) $("#qCount").textContent = countText(); }, 4000);
}
// Four answer cells in a fixed place: first and second (Yes No / A B), third (Neither, Not in this clip), fourth (Can't tell).
const SLOT = { yes: 1, a: 1, no: 2, b: 2, skip: 4 };
function answerButtons(p) {
  const cells = [[], [], [], []];
  p.options.forEach(o => cells[(SLOT[o.value] || 3) - 1].push(o));
  const button = o => `<button data-v="${esc(o.value)}" class="${isOn(p, o.value) ? "on" : ""}">${esc(o.label)}${KEYS[o.value] ? ` <kbd>${KEYS[o.value]}</kbd>` : ""}</button>`;
  return `<div class="q-hint"></div>` + cells.map((c, i) => `<div class="a${i + 1}">${c.map(button).join("")}</div>`).join("");
}
// "No" on a label question asks what it is instead, in the same zone: the other labels, or just no.
function showWhat() {
  const p = quiz.probes[quizIndex], asked = askedLabel(p);
  quizWhat = true;
  $("#qAnswers").classList.add("q-what");
  $("#qAnswers").innerHTML = `<div class="q-hint">What is it?</div>` +
    labelsOf(p).filter(l => l !== asked).map((l, i) => `<button data-v="is:${esc(l)}" style="grid-column: span 2"><span class="swatch" style="background:var(--sec-${esc(l)}, var(--text-muted))"></span>${esc(l)} <kbd>${i + 1}</kbd></button>`).join("") +
    `<button data-v="no" style="grid-column: span 2">Just no <kbd>N</kbd></button>`;
}

function quizClick(e) {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.classList.contains("q-play")) return playButton(+b.dataset.k);
  if (b.id === "optReplay") return playProbe(0, true);
  if (b.id === "optAutoplay") { autoplayOn = !autoplayOn; setPref("autoplay", autoplayOn); return flip(b, autoplayOn); }
  if (b.id === "optLoop") { loopOn = !loopOn; audio.loop = loopOn && !(cur && cur.chain); return flip(b, loopOn); }
  if (b.id === "optCue") { cueOn = !cueOn; setPref("cue", cueOn); flip(b, cueOn); return switchClip(); }
  if (b.id === "qBack") return goProbe(quizIndex - 1);
  if (b.id === "qSkip") return goProbe((quizIndex + 1) % quiz.probes.length);
  if (b.dataset.v) answerProbe(b.dataset.v);
}
function flip(b, on) { b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }

// ---- playing: one clip per play, started from the tap itself so iOS lets it
function playProbe(k, chain, at) {
  const p = quiz.probes[quizIndex], url = clipUrl(p, p.plays[k]);
  cur = { k, chain: !!chain };
  quizPlayed.add(p.id + ":" + k);
  audio.loop = loopOn && !chain;
  if (audio.src.endsWith(url)) { audio.currentTime = at || 0; audio.play().catch(() => {}); }
  else { audio.src = url; quizLoading = true; if (at) seekTo(at, true); else audio.play().catch(() => {}); }
  labelPlays();
}
function playButton(k) {
  const p = quiz.probes[quizIndex], same = cur && cur.k === k && audio.src.endsWith(clipUrl(p, p.plays[k]));
  if (same && !audio.paused) audio.pause();
  else if (same && !audio.ended && audio.currentTime > 0) audio.play().catch(() => {});
  else playProbe(k, false);
}
function togglePlayQuiz() {
  if (!cur) return playProbe(0, true);
  if (!audio.paused) audio.pause(); else if (audio.ended) playProbe(cur.k, cur.chain); else audio.play().catch(() => {});
}
function switchClip() {  // the cue was turned on or off: the same clip with or without it, from where it was
  const p = quiz.probes[quizIndex];
  if (!cur || !cueApplies(p.plays[cur.k])) return;
  const t = audio.currentTime, playing = !audio.paused;
  audio.src = clipUrl(p, p.plays[cur.k]);
  seekTo(t, playing);
}
function seekClip(k, t) {
  const p = quiz.probes[quizIndex], same = cur && cur.k === k && audio.src.endsWith(clipUrl(p, p.plays[k]));
  if (same) { audio.currentTime = t; if (audio.paused) audio.play().catch(() => {}); drawStrip(k); }
  else playProbe(k, false, t);
}
function labelPlays() {
  const p = quiz && quiz.probes[quizIndex];
  if (!p) return;
  document.querySelectorAll(".q-play").forEach(b => {
    const k = +b.dataset.k, name = playName(p, k), mine = cur && cur.k === k;
    b.querySelector(".q-label").textContent = mine && quizLoading ? name.replace("Play", "Loading") + "…"
      : mine && !audio.paused && !audio.ended ? "❚❚ " + name.replace("Play", "Pause")
      : quizPlayed.has(p.id + ":" + k) ? `↻ ${name} again` : `▶ ${name}`;
  });
}
audio.addEventListener("playing", () => { if (quiz && quizLoading) quizLoading = false; quizEvent(); });
["play", "pause", "seeked", "timeupdate"].forEach(n => audio.addEventListener(n, quizEvent));
audio.addEventListener("ended", () => {
  if (!quiz || !cur || document.body.dataset.view !== "round") return;
  const p = quiz.probes[quizIndex];
  if (p && cur.chain) {
    if (cur.k + 1 < p.plays.length) return playProbe(cur.k + 1, true);
    if (loopOn) return playProbe(0, true);
  }
  quizEvent();
});
audio.addEventListener("error", () => {
  if (!quiz || !cur || document.body.dataset.view !== "round") return;
  quizLoading = false; labelPlays(); note("Audio failed: tap Play to retry");
});
function quizEvent() { if (quiz && document.body.dataset.view === "round") { labelPlays(); updateNow(); strips.forEach((_, k) => drawStrip(k)); } }
// "It starts now": the bar line nearest the playhead, while a clip of a tap question plays or is paused inside it.
function nowLine() {
  const p = quiz && quiz.probes[quizIndex];
  if (!p || !cur || !tapsOn(p) || audio.ended || (audio.paused && !audio.currentTime)) return null;
  const pl = p.plays[cur.k], t = pl.start + audio.currentTime;
  const line = barLines(pl).reduce((best, g) => !best || Math.abs(g[0] - t) < Math.abs(best[0] - t) ? g : best, null);
  return line && pickable(p, line[2]) ? line : null;
}
function updateNow() {
  const b = $("#qNow"), g = nowLine(), v = g ? "bar:" + g[2] : "";
  if (b) { b.disabled = !g; b.dataset.v = v; }
  document.querySelectorAll(".q-barbtn").forEach(x => x.classList.toggle("now", !!v && x.dataset.v === v));
}

// ---- the strip: peaks, bar lines (full height, the beats between them short), the marker, the playhead
function setupStrip(c, p, pl, numbered) {
  const k = strips.length;
  strips.push({ c, pl, numbered });
  const resize = () => { const r = c.getBoundingClientRect(); c.width = r.width * devicePixelRatio; c.height = r.height * devicePixelRatio; drawStrip(k); };
  new ResizeObserver(resize).observe(c);
  c.addEventListener("pointerup", e => { const r = c.getBoundingClientRect(); seekClip(k, Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (pl.end - pl.start)); });
}
function drawStrip(k) {
  const s = strips[k];
  if (!s || !s.c.width) return;
  const { c, pl, numbered } = s, ctx = c.getContext("2d"), W = c.width, H = c.height, d = devicePixelRatio, D = pl.end - pl.start;
  const X = t => (t - pl.start) / D * W, mine = cur && quiz.probes[quizIndex].plays[cur.k] === pl, now = mine ? audio.currentTime : 0;
  const top = numbered ? 15 * d : 0, mid = top + (H - top) / 2, amp = (H - top) / 2 - d;
  ctx.fillStyle = css("--surface-1"); ctx.fillRect(0, 0, W, H);
  const pk = pl.peaks;
  if (pk) { ctx.fillStyle = css("--wave"); pk.values.forEach((v, i) => { const x0 = X(pk.t0 + i / pk.rate), x1 = X(pk.t0 + (i + 1) / pk.rate); ctx.fillRect(x0, mid - v * amp, Math.max(1, x1 - x0 - 0.5), 2 * v * amp || 1); }); }
  if (now > 0) { ctx.fillStyle = css("--accent"); ctx.globalAlpha = 0.2; ctx.fillRect(0, 0, X(pl.start + now), H); ctx.globalAlpha = 1; }
  const limit = (quiz.probes[quizIndex].before != null) && (pl.grid || []).find(g => g[1] && g[2] === quiz.probes[quizIndex].before);
  if (limit) { ctx.fillStyle = css("--surface-0"); ctx.globalAlpha = 0.6; ctx.fillRect(X(limit[0]), 0, W - X(limit[0]), H); ctx.globalAlpha = 1; }   // the bars that cannot be tapped
  const strong = css("--text-primary"), faint = css("--text-muted");
  ctx.font = `${11 * d}px -apple-system, sans-serif`; ctx.textBaseline = "top";
  let n = 0, free = 0;
  (pl.grid || []).forEach(([t, down, bar]) => {
    const x = X(t);
    ctx.globalAlpha = down ? 0.65 : 0.55; ctx.fillStyle = down ? strong : faint;
    if (down) ctx.fillRect(x - d, 0, 2 * d, H); else ctx.fillRect(x, H - 10 * d, d, 10 * d);
    ctx.globalAlpha = 1;
    if (down && bar != null && numbered) {  // the number sits right of its line, left of it at the edge, and is left out where it would overlap the last
      n++;
      const w = ctx.measureText(String(n)).width, right = x + 4 * d + w > W, at = right ? x - 4 * d - w : x + 4 * d;
      if (at >= free) { ctx.textAlign = "left"; ctx.fillStyle = css("--text-secondary"); ctx.fillText(String(n), at, 2 * d); free = at + w + 3 * d; }
    }
  });
  if (pl.mark != null) { ctx.fillStyle = css("--mark"); ctx.fillRect(Math.min(W - 1.5 * d, Math.max(1.5 * d, X(pl.mark))) - 1.5 * d, 0, 3 * d, H); }
  const pick = chosenBar != null && (pl.grid || []).find(g => g[1] && g[2] === chosenBar);
  if (pick) { ctx.fillStyle = css("--good"); ctx.fillRect(X(pick[0]) - 2 * d, 0, 4 * d, H); }
  if (mine) { ctx.fillStyle = css("--playhead"); ctx.fillRect(X(pl.start + now) - d, 0, 2 * d, H); }
}

// ---- answering
async function answerProbe(v) {
  if (quizBusy || performance.now() - quizShown < DOUBLE_TAP_MS) return;
  const p = quiz.probes[quizIndex], shownAt = quizShown, picked = v.startsWith("bar:"), began = performance.now();
  if (picked && !pickable(p, +v.slice(4))) return;
  if (v === "no" && !quizWhat && askedLabel(p)) return showWhat();
  quizBusy = true;
  const fresh = p.answer == null;
  if (picked) pickBar(+v.slice(4));
  try {
    await api(`/api/answers/${p.id}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer: v }) });
    if (picked) await new Promise(r => setTimeout(r, Math.max(0, PICK_MS - (performance.now() - began))));
  } catch (e) {
    if (picked) pickBar(String(p.answer).startsWith("bar:") ? +p.answer.slice(4) : null);
    if (!(e instanceof NeedPin)) note("Not saved: " + e.message);
    return;
  } finally { quizBusy = false; }
  p.answer = v;
  quiz.progress.answered = quiz.probes.length - openProbes();
  updateProgress();
  if (quizShown !== shownAt) return;   // the reviewer went elsewhere meanwhile
  const answered = quiz.progress.answered;
  if (fresh && answered % BREAK_EVERY === 0 && openProbes()) return showBreak(answered);
  goProbe(nextProbe(quizIndex), true);
}
function pickBar(bar) {
  chosenBar = bar;
  document.querySelectorAll(".q-barbtn").forEach(b => b.classList.toggle("on", bar != null && b.dataset.v === "bar:" + bar));
  strips.forEach((_, k) => drawStrip(k));
}

function showBreak(answered) {
  cur = null; strips.length = 0;
  setView("round");
  quizShown = performance.now();
  $("#main").innerHTML = `<div class="quiz q-break">
    <p class="q-prompt">${answered} answered</p>
    <div class="status">${openProbes()} left in this round. Take a moment, or carry on.</div>
    <div class="q-bar"><div class="q-answers">
      <button id="qStop" style="grid-column: span 3">Stop for now <kbd>Esc</kbd></button><button id="qContinue" class="primary" style="grid-column: span 3">Continue <kbd>Enter</kbd></button>
    </div></div></div>`;
  $("#qStop").addEventListener("click", () => { if (performance.now() - quizShown >= DOUBLE_TAP_MS) showSongs(); });
  $("#qContinue").addEventListener("click", () => { if (performance.now() - quizShown >= DOUBLE_TAP_MS) goProbe(nextProbe(quizIndex), true); });
}

function renderDone() {
  $("#main").innerHTML = `<div class="quiz q-done">
    <p class="q-prompt">Round ${quiz.round} done</p>
    <div class="status">All ${quiz.probes.length} questions answered. Thank you.</div>
    <div class="report" id="report"><div class="status">Loading the report…</div></div>
    <div class="q-bar"><div class="q-answers">
      <button id="qReview" style="grid-column: span 3">Change answers</button><button id="qSongs" style="grid-column: span 3">Browse songs</button>
    </div></div></div>`;
  $("#qReview").addEventListener("click", () => goProbe(0));
  $("#qSongs").addEventListener("click", showSongs);
  loadReport();
}

// ---- keyboard: Space play/pause, R replay, Y N E L C or A B answer, 1-9 a bar or label, S and arrows move, Esc leaves
function quizKey(e) {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key, p = quiz.probes[quizIndex], q = document.querySelector(".quiz");
  if (e.code === "Space") e.preventDefault();
  if (q && q.classList.contains("q-break")) {
    if (k === "Enter") $("#qContinue").click(); else if (k === "Escape") $("#qStop").click();
    return;
  }
  if (k === "Escape") return quizWhat ? renderProbe() : showSongs();
  if (!p) return;
  if (k === "Enter") { e.preventDefault(); const b = $("#qNow"); if (b && !b.disabled) answerProbe(b.dataset.v); }
  else if (e.code === "Space") togglePlayQuiz();
  else if (k === "r") playProbe(0, true);
  else if (k === "s" || k === "ArrowRight") goProbe((quizIndex + 1) % quiz.probes.length);
  else if (k === "ArrowLeft" && quizIndex) goProbe(quizIndex - 1);
  else if (/^[1-9]$/.test(k)) { const b = document.querySelectorAll(quizWhat ? ".q-what button[data-v^='is:']" : ".q-barbtn")[+k - 1]; if (b && !b.disabled) answerProbe(b.dataset.v); }
  else if (quizWhat) { if (k === "n") answerProbe("no"); }
  else { const o = p.options.find(o => KEYS[o.value] === k.toUpperCase()); if (o) answerProbe(o.value); }
}
document.addEventListener("keyup", e => { if (e.code === "Space" && document.body.dataset.view === "round") e.preventDefault(); });

// ---------- the round report ----------
function reportHtml(r) {
  const t = r.target || {}, theory = id => (quiz && quiz.theories.find(x => x.id === id) || {}).text || id;
  const table = (head, rows) => `<div class="scroll-x"><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map(x => `<tr>${x.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
  const panel = (title, body) => `<div class="panel"><h3>${title}</h3>${body}</div>`;
  const none = text => `<div class="status">${text}</div>`;
  const sources = Object.entries(r.sources || {}), again = (r.reviewer || {}).repeats || 0, same = Math.round(((r.reviewer || {}).same || 0) * again);
  return `<div class="rtiles">
      <div class="tile"><div class="k">Target</div><div class="v">${t.met ? "Met" : "Not yet"}</div><div class="s">95% exact at 95% confidence, 70% coverage</div></div>
      <div class="tile"><div class="k">Exact at 95%+</div><div class="v">${pct(t.sure_exact)}</div><div class="s">${t.sure_n || 0} answers, 20 needed</div></div>
      <div class="tile"><div class="k">Coverage</div><div class="v">${pct(r.coverage ?? t.coverage)}</div><div class="s">of Claims reach 95%</div></div></div>` +
    panel("Rounds", (r.rounds || []).length ? table(["", "Answered", "Grid", "Start", "Label"], r.rounds.map(x => [`Round ${x.round}`, `${x.answered}/${x.total}`, pct((x.fresh_exact || {}).grid), pct((x.fresh_exact || {}).start), pct((x.fresh_exact || {}).label)])) + none("Share of Claims you accepted on the round's new tracks.") : none("No rounds yet.")) +
    panel("Theories", Object.keys(r.theories || {}).length ? table(["Theory", "Answers", "Confirmed"], Object.entries(r.theories).map(([id, v]) => [esc(v.text || theory(id)), v.n, pct(v.confirmed)])) : none("No Theory results yet.")) +
    panel("Calibration", (r.calibration || []).length ? table(["Confidence", "Answers", "Exact"], r.calibration.map(b => [b.band, b.n, pct(b.exact)])) + none("Claims at 95% should be exact about 95% of the time.") : none("No answers yet.")) +
    (sources.length ? panel("Sources", table(["Source", "Answers", "Exact"], sources.map(([name, v]) => [esc(name), v.n, pct(v.exact)]))) : "") +
    (again > 0 ? panel("Consistency", `<div>You answered ${same} of ${again} question${again === 1 ? "" : "s"} the same way when they came up again (${pct(r.reviewer.same)}).</div>`) : "");
}
async function loadReport() {
  let html;
  try { html = reportHtml(await api("/api/report")); }
  catch (e) { if (e instanceof NeedPin) return; html = `<div class="status">The report could not be loaded: ${esc(e.message)}</div>`; }
  const el = $("#report"); if (el) el.innerHTML = html;
}

// ---------- summary ----------
const pct = v => v == null ? "–" : (v * 100).toFixed(0) + "%";
async function showSummary() {
  currentId = null; doc = null; renderList();
  const s = await api("/api/summary");
  setView("summary");
  const tempoTotal = Object.values(s.tempo).reduce((a, b) => a + b, 0) - s.tempo.untagged;
  const evRows = Object.entries(s.events).map(([k, c]) => `<tr><td>${k}</td><td>${c.ok}</td><td>${c.off}</td><td>${c.wrong}</td><td>${c.missed}</td><td>${pct(c.precision)}</td><td>${pct(c.recall)}</td></tr>`).join("");
  $("#main").innerHTML = `<div class="track"><div class="report" id="report"><div class="status">Loading the report…</div></div><div class="meta">From your ratings. Precision = share of predicted events that were right; recall = share of real events that were found (on the right bar).</div>
    <div class="tiles">
      <div class="tile"><div class="k">Tracks rated</div><div class="v">${s.tracks_rated}</div><div class="s">of ${s.tracks_analyzed} analyzed</div></div>
      <div class="tile"><div class="k">Tempo = filename BPM</div><div class="v">${pct(tempoTotal ? s.tempo.match / tempoTotal : null)}</div><div class="s">${s.tempo.match} match · ${s.tempo.double} double · ${s.tempo.half} half · ${s.tempo.mismatch} other</div></div>
      <div class="tile"><div class="k">Beats on the beat</div><div class="v">${pct(s.beats_ok)}</div></div>
      <div class="tile"><div class="k">Bar 1 correct</div><div class="v">${pct(s.downbeat_ok)}</div></div>
      <div class="tile"><div class="k">Section labels right</div><div class="v">${pct(s.section_label_accuracy)}</div></div>
      <div class="tile"><div class="k">Usable for lighting</div><div class="v">${s.overall_mean == null ? "–" : s.overall_mean.toFixed(1)}</div><div class="s">mean of 1–5</div></div>
    </div>
    <div class="panel"><h3>Events</h3><div class="scroll-x"><table><tr><th>Kind</th><th>✓</th><th>Off</th><th>✗</th><th>Missed</th><th>Prec.</th><th>Recall</th></tr>${evRows || `<tr><td colspan=7 class="status">No event ratings yet</td></tr>`}</table></div></div>
    <div class="panel"><h3>Label confusion (predicted → your label)</h3><table>${Object.entries(s.label_confusion).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<tr><td>${k.replace("->", " → ")}</td><td>${n}</td></tr>`).join("") || `<tr><td class="status">None yet</td></tr>`}</table></div></div>`;
  loadReport();
}

async function start() {
  try {
    await Promise.all([loadTracks(), loadRound()]);
    updateProgress();
    const id = location.hash.slice(1);
    if (/^[0-9a-f]{16}$/.test(id)) openTrack(id);
    else if (quiz && openProbes()) showRound(nextProbe(-1));
  } catch (e) { if (!(e instanceof NeedPin)) $("#main").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`; }
}
start();
</script>
</body>
</html>
