[project]
name = "edm-analysis"
version = "0.1.0"
description = "Offline EDM track analysis for QLC+: beats, bars, phrases, sections, drops, stem activity"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beat-this",
    "demucs",
    "librosa",
    "mir_eval",
    "numpy",
    "soundfile",
    "soxr",
    "torch",
    "tqdm",
    "einops",
    "rotary-embedding-torch",
    "pyarrow>=26.0.1",
]

[project.scripts]
edm-analysis = "edm_analysis.cli:main"

[dependency-groups]
dev = [
    "playwright==1.63.0",
    "pytest",
    "pytest-playwright>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edm_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
